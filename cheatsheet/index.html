<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code – ściąga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
  :root {
    color-scheme: light;
    --primary: #6366F1;
    --primary-hover: #4F46E5;
    --neutral: #9C9C9C;
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --text: #0A0A0A;
    --text-2: #6B6B6B;
    --border: #E8E8EC;
    --error: #EF4444;
    --nav-bg: rgba(250, 250, 250, 0.8);
    --on-primary: #FAFAFA;
    --focus-ring: rgba(99, 102, 241, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --primary: #818CF8;
      --primary-hover: #A5B4FC;
      --bg: #0F0F12;
      --surface: #17171C;
      --text: #F4F4F5;
      --text-2: #A1A1AA;
      --border: #2A2A33;
      --nav-bg: rgba(15, 15, 18, 0.8);
      --on-primary: #0F0F12;
      --focus-ring: rgba(129, 140, 248, 0.2);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary: #818CF8;
    --primary-hover: #A5B4FC;
    --bg: #0F0F12;
    --surface: #17171C;
    --text: #F4F4F5;
    --text-2: #A1A1AA;
    --border: #2A2A33;
    --nav-bg: rgba(15, 15, 18, 0.8);
    --on-primary: #0F0F12;
    --focus-ring: rgba(129, 140, 248, 0.2);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 400;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

  /* Navigation */
  .nav {
    position: sticky;
    top: 0;
    z-index: 10;
    height: 56px;
    background: var(--nav-bg);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner { height: 100%; display: flex; align-items: center; gap: 16px; }
  .brand {
    font-family: "General Sans", system-ui, sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.03em;
    white-space: nowrap;
  }
  .search {
    flex: 1 1 auto;
    max-width: 420px;
    margin: 0 auto;
    position: relative;
  }
  .search svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--neutral);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 36px;
    padding: 8px 56px 8px 36px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    font-size: 13px;
  }
  .search input::placeholder { color: var(--neutral); }
  .search input:focus-visible { border-color: var(--primary); }
  .search kbd {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--text-2);
    pointer-events: none;
  }
  .ghost {
    flex: 0 0 auto;
    height: 32px;
    padding: 0 12px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    transition: color 200ms ease, transform 200ms ease;
  }
  .ghost:hover { color: var(--text); transform: translateY(-1px); }

  /* Intro */
  .intro { padding-top: 32px; }
  h1, h2 { font-family: "General Sans", system-ui, sans-serif; font-weight: 700; color: var(--text); }
  h1 {
    margin: 0 0 16px;
    font-size: 32px;
    line-height: 1.1;
    letter-spacing: -0.04em;
  }
  .subtitle { margin: 0; color: var(--text-2); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .chip {
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text-2);
    font-size: 12px;
    transition: transform 200ms ease;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip[aria-pressed="true"] {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary);
  }

  /* Content */
  main { padding-bottom: 32px; }
  #content { margin-top: 32px; }
  section { margin-bottom: 32px; }
  section h2 {
    margin: 0 0 4px;
    font-size: 24px;
    line-height: 1.2;
    letter-spacing: -0.03em;
  }
  .section-desc { margin: 0 0 16px; color: var(--text-2); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
  }
  .card-head { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  code.cmd {
    padding: 4px 8px;
    background: var(--bg);
    border-radius: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .copy {
    flex: 0 0 auto;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    transition: color 200ms ease, transform 200ms ease;
  }
  .copy:hover { color: var(--text); transform: translateY(-1px); }
  .desc { margin: 0; }
  .example {
    margin: 0;
    color: var(--text-2);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-2);
    font-size: 12px;
  }
  .status { padding: 48px 0; color: var(--text-2); text-align: center; }
  .status.error { color: var(--error); }
  footer {
    padding: 24px;
    color: var(--text-2);
    font-size: 12px;
    text-align: center;
  }
  footer code { font-family: "JetBrains Mono", ui-monospace, monospace; }

  @media (min-width: 768px) {
    .intro { padding-top: 48px; }
    h1 { font-size: 60px; }
    section { margin-bottom: 48px; }
  }
  @media (min-width: 1024px) {
    .intro { padding-top: 64px; }
    section { margin-bottom: 64px; }
    .grid { gap: 24px; }
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .search kbd { display: none; }
    .search input { padding-right: 12px; }
  }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <span class="brand">Claude Code</span>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.5-3.5" stroke-linecap="round"></path>
      </svg>
      <input type="search" id="search" placeholder="Szukaj komendy, opisu lub tagu…" aria-label="Szukaj">
      <kbd>⌘K</kbd>
    </label>
    <button class="ghost" id="theme" type="button" aria-label="Przełącz motyw">Motyw</button>
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <h1 id="title">Claude Code – ściąga</h1>
    <p class="subtitle" id="subtitle"></p>
    <div id="filters" class="filters" role="group" aria-label="Filtr sekcji"></div>
  </div>
  <div id="content"></div>
</main>

<footer>Dane: <code>claude-code-commands.json</code></footer>

<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/typescript" id="app">
  interface CommandItem {
    command: string;
    description: string;
    example?: string;
    tags?: string[];
  }

  interface Section {
    id: string;
    title: string;
    description?: string;
    items: CommandItem[];
  }

  interface CheatsheetData {
    title?: string;
    description?: string;
    sections: Section[];
  }

  interface State {
    data: CheatsheetData | null;
    query: string;
    section: string;
  }

  const DATA_URL = "claude-code-commands.json";
  const state: State = { data: null, query: "", section: "all" };

  const els = {
    title: document.getElementById("title") as HTMLElement,
    subtitle: document.getElementById("subtitle") as HTMLElement,
    search: document.getElementById("search") as HTMLInputElement,
    filters: document.getElementById("filters") as HTMLElement,
    content: document.getElementById("content") as HTMLElement,
    theme: document.getElementById("theme") as HTMLElement,
  };

  function el(tag: string, props: Record<string, string> = {}, children: Node[] = []): HTMLElement {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "className") node.className = value;
      else if (key === "text") node.textContent = value;
      else node.setAttribute(key, value);
    }
    for (const child of children) node.append(child);
    return node;
  }

  function setStatus(message: string, isError = false): void {
    els.content.replaceChildren(
      el("p", { className: `status${isError ? " error" : ""}`, text: message })
    );
  }

  function renderHeader(data: CheatsheetData): void {
    document.title = data.title || "Claude Code – ściąga";
    els.title.textContent = data.title || "Claude Code – ściąga";
    els.subtitle.textContent = data.description || "";
  }

  function renderFilters(data: CheatsheetData): void {
    const makeChip = (id: string, label: string): HTMLElement => {
      const btn = el("button", {
        className: "chip",
        type: "button",
        "aria-pressed": String(state.section === id),
        "data-section": id,
        text: label,
      });
      btn.addEventListener("click", () => {
        state.section = id;
        renderFilters(data);
        render();
      });
      return btn;
    };
    els.filters.replaceChildren(
      makeChip("all", "Wszystko"),
      ...data.sections.map((s) => makeChip(s.id, s.title))
    );
  }

  function matches(item: CommandItem, sectionTitle: string, query: string): boolean {
    if (!query) return true;
    const haystack = [
      item.command,
      item.description,
      item.example || "",
      sectionTitle,
      ...(item.tags || []),
    ]
      .join(" ")
      .toLowerCase();
    return haystack.includes(query);
  }

  function makeCard(item: CommandItem): HTMLElement {
    const copyBtn = el("button", { className: "copy", type: "button", text: "Kopiuj" });
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(item.command);
        copyBtn.textContent = "Skopiowano";
      } catch {
        copyBtn.textContent = "Błąd";
      }
      setTimeout(() => (copyBtn.textContent = "Kopiuj"), 1200);
    });

    const children: Node[] = [
      el("div", { className: "card-head" }, [
        el("code", { className: "cmd", text: item.command }),
        copyBtn,
      ]),
      el("p", { className: "desc", text: item.description }),
    ];
    if (item.example) {
      children.push(el("pre", { className: "example", text: `np. ${item.example}` }));
    }
    if (item.tags && item.tags.length) {
      children.push(
        el("div", { className: "tags" },
          item.tags.map((t) => el("span", { className: "tag", text: t })))
      );
    }
    return el("article", { className: "card" }, children);
  }

  function render(): void {
    const { data, query, section } = state;
    if (!data) return;
    const q = query.trim().toLowerCase();
    const blocks: HTMLElement[] = [];

    for (const s of data.sections) {
      if (section !== "all" && section !== s.id) continue;
      const items = s.items.filter((item) => matches(item, s.title, q));
      if (!items.length) continue;
      blocks.push(
        el("section", {}, [
          el("h2", { text: s.title }),
          el("p", { className: "section-desc", text: s.description || "" }),
          el("div", { className: "grid" }, items.map(makeCard)),
        ])
      );
    }

    if (!blocks.length) {
      setStatus("Brak wyników dla podanego zapytania.");
      return;
    }
    els.content.replaceChildren(...blocks);
  }

  function load(data: CheatsheetData): void {
    if (!data || !Array.isArray(data.sections)) {
      throw new Error("Data file has an unexpected structure (missing sections field).");
    }
    state.data = data;
    renderHeader(data);
    renderFilters(data);
    render();
  }

  async function loadFromUrl(): Promise<void> {
    try {
      const response = await fetch(DATA_URL);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      load((await response.json()) as CheatsheetData);
    } catch (err) {
      console.error("Failed to load data:", err);
      setStatus(
        "Nie udało się wczytać claude-code-commands.json z tego samego katalogu. " +
        "Otwierając plik bezpośrednio z dysku (file://), przeglądarka blokuje wczytywanie danych – " +
        "uruchom lokalny serwer, np. `python3 -m http.server` w katalogu z plikami.",
        true
      );
    }
  }

  els.search.addEventListener("input", (event) => {
    state.query = (event.target as HTMLInputElement).value;
    render();
  });

  document.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
      event.preventDefault();
      els.search.focus();
      els.search.select();
    }
  });

  const root = document.documentElement;
  els.theme.addEventListener("click", () => {
    const current = root.getAttribute("data-theme");
    const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
    const isDark = current ? current === "dark" : systemDark;
    root.setAttribute("data-theme", isDark ? "light" : "dark");
  });

  loadFromUrl();
</script>
<script>
  const appSource = document.getElementById("app").textContent;
  const { code } = Babel.transform(appSource, { filename: "app.ts", presets: ["typescript"] });
  const appScript = document.createElement("script");
  appScript.textContent = code;
  document.body.append(appScript);
</script>
</body>
</html>
