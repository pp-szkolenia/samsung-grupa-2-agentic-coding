<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code – ściąga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
  :root {
    color-scheme: light;
    --primary: #6366F1;
    --primary-hover: #4F46E5;
    --neutral: #9C9C9C;
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --text: #0A0A0A;
    --text-2: #6B6B6B;
    --border: #E8E8EC;
    --error: #EF4444;
    --nav-bg: rgba(250, 250, 250, 0.8);
    --on-primary: #FAFAFA;
    --focus-ring: rgba(99, 102, 241, 0.12);
    --success: #10B981;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --primary: #818CF8;
      --primary-hover: #A5B4FC;
      --bg: #0F0F12;
      --surface: #17171C;
      --text: #F4F4F5;
      --text-2: #A1A1AA;
      --border: #2A2A33;
      --nav-bg: rgba(15, 15, 18, 0.8);
      --on-primary: #0F0F12;
      --focus-ring: rgba(129, 140, 248, 0.2);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary: #818CF8;
    --primary-hover: #A5B4FC;
    --bg: #0F0F12;
    --surface: #17171C;
    --text: #F4F4F5;
    --text-2: #A1A1AA;
    --border: #2A2A33;
    --nav-bg: rgba(15, 15, 18, 0.8);
    --on-primary: #0F0F12;
    --focus-ring: rgba(129, 140, 248, 0.2);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 400;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--text); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

  /* Navigation */
  .nav {
    position: sticky;
    top: 0;
    z-index: 10;
    height: 56px;
    background: var(--nav-bg);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner { height: 100%; display: flex; align-items: center; gap: 16px; }
  .brand {
    font-family: "General Sans", system-ui, sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.03em;
    white-space: nowrap;
    text-decoration: none;
  }
  .search {
    flex: 1 1 auto;
    max-width: 420px;
    margin: 0 auto;
    position: relative;
  }
  .search svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--neutral);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 36px;
    padding: 8px 56px 8px 36px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    font-size: 13px;
  }
  .search input::placeholder { color: var(--neutral); }
  .search input:focus-visible { border-color: var(--primary); }
  .search kbd {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--text-2);
    pointer-events: none;
  }
  .ghost {
    flex: 0 0 auto;
    height: 32px;
    padding: 0 12px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    transition: color 200ms ease, transform 200ms ease;
  }
  .ghost:hover { color: var(--text); transform: translateY(-1px); }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 38px;
    padding: 0 16px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: transform 200ms ease, box-shadow 200ms ease, color 200ms ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35); }
  .btn-secondary { border-color: var(--border); background: var(--surface); }
  .btn-ghost { color: var(--text-2); }
  .btn-ghost:hover { color: var(--text); }
  .btn-danger { border-color: var(--error); color: var(--error); background: transparent; }

  /* Intro and toolbar */
  .intro { padding-top: 32px; }
  h1, h2 { font-family: "General Sans", system-ui, sans-serif; font-weight: 700; color: var(--text); }
  h1 {
    margin: 0 0 16px;
    font-size: 32px;
    line-height: 1.1;
    letter-spacing: -0.04em;
  }
  .subtitle { margin: 0; color: var(--text-2); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 24px; }
  .toolbar .status-line { margin-left: auto; color: var(--text-2); font-size: 13px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .chip {
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text-2);
    font-size: 12px;
    transition: transform 200ms ease;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip[aria-pressed="true"] {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary);
  }

  /* Content */
  main { padding-bottom: 32px; }
  #view { margin-top: 32px; }
  section { margin-bottom: 32px; }
  section h2 {
    margin: 0 0 4px;
    font-size: 24px;
    line-height: 1.2;
    letter-spacing: -0.03em;
  }
  .section-desc { margin: 0 0 16px; color: var(--text-2); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
  }
  .card-head { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .card-title { margin: 0; font-size: 18px; line-height: 1.25; letter-spacing: -0.02em; }
  .card-title a { text-decoration: none; }
  .card-title a:hover { color: var(--primary); }
  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 8px; }
  code.cmd {
    padding: 4px 8px;
    background: var(--bg);
    border-radius: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .copy {
    flex: 0 0 auto;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    transition: color 200ms ease, transform 200ms ease;
  }
  .copy:hover { color: var(--text); transform: translateY(-1px); }
  .desc { margin: 0; }
  .example {
    margin: 0;
    color: var(--text-2);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-2);
    font-size: 12px;
  }
  .status { padding: 48px 0; color: var(--text-2); text-align: center; }
  .status.error { color: var(--error); }

  /* Slides: sizes use container units (cqw), so a slide looks the same at any width (thumbnail, preview, fullscreen). */
  .slide {
    container-type: inline-size;
    display: flex;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--slide-bg, #FFFFFF);
    color: var(--slide-text, #0A0A0A);
    font-family: var(--slide-font, "DM Sans", system-ui, sans-serif);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .slide-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2cqw; padding: 5cqw 6cqw; overflow: hidden; }
  .slide h2 {
    margin: 0;
    font-family: inherit;
    font-size: 4cqw;
    line-height: 1.1;
    letter-spacing: -0.03em;
    color: inherit;
  }
  .slide-bullets h2::after, .slide-text h2::after, .slide-two-columns h2::after, .slide-code h2::after {
    content: "";
    display: block;
    width: 6cqw;
    height: 0.6cqw;
    margin-top: 1.4cqw;
    border-radius: 1cqw;
    background: var(--slide-accent, #6366F1);
  }
  .slide p, .slide ul, .slide blockquote { margin: 0; }
  .slide ul { padding-left: 3.5cqw; font-size: 2.6cqw; line-height: 1.35; }
  .slide li { margin: 0.9cqw 0; }
  .slide li::marker { color: var(--slide-accent, #6366F1); }
  .slide-body > p { font-size: 2.6cqw; line-height: 1.5; white-space: pre-wrap; }
  .slide-title .slide-body { justify-content: center; padding: 6cqw 9cqw; gap: 2.4cqw; }
  .slide-title h2 { font-size: 7cqw; }
  .slide-title h2::after {
    content: "";
    display: block;
    width: 10cqw;
    height: 0.9cqw;
    margin-top: 2.4cqw;
    border-radius: 1cqw;
    background: var(--slide-accent, #6366F1);
  }
  .slide-title .slide-body > p { font-size: 3cqw; opacity: 0.7; }
  .slide-columns { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4cqw; }
  .slide-column {
    padding-top: 2cqw;
    border-top: 0.5cqw solid var(--slide-accent, #6366F1);
    font-size: 2.4cqw;
    line-height: 1.45;
    white-space: pre-wrap;
    overflow: hidden;
  }
  .slide-quote .slide-body { justify-content: center; padding: 6cqw 10cqw; gap: 2.6cqw; }
  .slide-kicker {
    color: var(--slide-accent, #6366F1);
    font-size: 1.6cqw;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .slide blockquote {
    position: relative;
    font-size: 3.6cqw;
    font-style: italic;
    line-height: 1.3;
    white-space: pre-wrap;
  }
  .slide blockquote::before {
    content: "“";
    display: block;
    height: 6cqw;
    color: var(--slide-accent, #6366F1);
    font-size: 12cqw;
    font-style: normal;
    line-height: 1;
  }
  .slide-author { color: var(--slide-accent, #6366F1); font-size: 2.2cqw; font-weight: 700; }
  .slide-code-block {
    margin: 0;
    padding: 2cqw 2.4cqw;
    overflow: hidden;
    background: #0F0F12;
    color: #F4F4F5;
    border-radius: 1cqw;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 1.8cqw;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .slide-code .slide-code-block { flex: 1; font-size: 2.2cqw; }

  /* Presentation viewer: thumbnails | current slide | next slide and notes */
  .deck { display: grid; gap: 16px; margin-top: 24px; }
  .deck-main, .deck-side { min-width: 0; }
  .deck-frame { width: 100%; }
  .deck-frame:fullscreen { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
  .deck-frame:fullscreen .slide { width: min(100vw, 177.78vh); border: none; border-radius: 0; }
  .deck-progress { height: 4px; margin-top: 12px; overflow: hidden; background: var(--border); border-radius: 2px; }
  .deck-progress span { display: block; height: 100%; background: var(--primary); transition: width 200ms; }
  .slide-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
  .slide-counter { margin: 0 auto; color: var(--text-2); font-size: 13px; }
  .deck-thumbs { position: relative; display: flex; gap: 8px; padding: 2px; overflow: auto; }
  .deck-thumb {
    position: relative;
    flex: 0 0 140px;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 12px;
    background: none;
    text-align: left;
  }
  .deck-thumb[aria-current="true"] { border-color: var(--primary); }
  .deck-thumb .slide { pointer-events: none; border-radius: 8px; }
  .deck-thumb-num {
    position: absolute;
    left: 6px;
    bottom: 6px;
    min-width: 20px;
    padding: 0 6px;
    background: rgba(15, 15, 18, 0.75);
    color: #FFFFFF;
    border-radius: 10px;
    font-size: 11px;
    line-height: 20px;
  }
  .side-label { margin: 0 0 6px; color: var(--text-2); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  .deck-side { display: flex; flex-direction: column; gap: 16px; }
  .deck-next .slide { border-radius: 8px; }
  /* PDF export: only #print-deck is printed, one 16:9 slide per page. */
  #print-deck { display: none; }
  @page { size: 297mm 167mm; margin: 0; }
  @media print {
    body > *:not(#print-deck) { display: none !important; }
    html, body { margin: 0; padding: 0; background: #FFFFFF; }
    #print-deck { display: block; }
    #print-deck .slide {
      width: 297mm;
      height: 167mm;
      aspect-ratio: auto;
      border: none;
      border-radius: 0;
      break-after: page;
      break-inside: avoid;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    #print-deck .slide:last-child { break-after: auto; }
  }

  .deck-end {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 16 / 9;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--text-2);
    font-size: 13px;
  }
  .slide-notes { margin: 0; color: var(--text-2); font-size: 13px; white-space: pre-wrap; }
  .deck-timer { display: none; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 28px; }
  .deck.presenter .deck-timer { display: block; }
  .deck.presenter .slide-notes { color: var(--text); font-size: 18px; }
  .deck.presenter .deck-thumbs { display: none; }

  /* Slide preview in the editor */
  .slide-preview { display: flex; flex-direction: column; gap: 8px; }
  .slide-preview .slide-controls { margin-top: 0; }
  .contrast-warning { margin: 0; color: var(--warning, #F59E0B); font-size: 13px; }

  /* Quiz */
  .quiz-card {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .quiz-kicker { color: var(--text-2); font-size: 13px; }
  .quiz-card h2 { margin: 0; font-size: clamp(20px, 3vw, 32px); line-height: 1.2; letter-spacing: -0.03em; white-space: pre-wrap; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-option {
    padding: 12px 16px;
    font: inherit;
    font-size: 15px;
    text-align: left;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--primary); }
  .quiz-option:disabled { cursor: default; }
  .quiz-option.correct { border-color: var(--success); font-weight: 500; }
  .quiz-option.wrong { border-color: var(--error); font-weight: 500; }
  .quiz-feedback { margin: 0; font-weight: 500; }
  .quiz-explanation { margin: 0; color: var(--text-2); font-size: 14px; }

  /* Editor */
  .editor { display: grid; gap: 24px; margin-top: 24px; }
  .form { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 13px; font-weight: 500; color: var(--text-2); }
  input[type="color"] { height: 38px; padding: 4px; cursor: pointer; }
  select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    font-size: 14px;
  }
  select:focus-visible { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }
  input, textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    font-size: 14px;
  }
  textarea { min-height: 80px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--neutral); }
  .group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .group > .btn { align-self: flex-start; }
  .item {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .item-head { display: flex; justify-content: space-between; align-items: center; }
  .item-actions { display: flex; flex-wrap: wrap; gap: 4px; }
  .json-short { max-height: 30vh; }
  .preview { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .preview h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
  .errors {
    margin: 0;
    padding: 12px 12px 12px 32px;
    border: 1px solid var(--error);
    border-radius: 8px;
    color: var(--error);
    font-size: 13px;
  }
  .json {
    margin: 0;
    max-height: 70vh;
    overflow: auto;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    white-space: pre;
  }
  .back { display: inline-block; margin-bottom: 16px; color: var(--text-2); font-size: 13px; text-decoration: none; }
  .back:hover { color: var(--text); }

  footer {
    padding: 24px;
    color: var(--text-2);
    font-size: 12px;
    text-align: center;
  }
  footer code { font-family: "JetBrains Mono", ui-monospace, monospace; }

  /* Instrukcja: link w nagłówku, sidebar z artykułami i treść Markdown */
  .nav-link { color: var(--text-2); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .nav-link:hover { color: var(--text); }

  .docs { display: grid; gap: 24px; padding: 32px 0 64px; }
  .docs-nav { display: flex; flex-wrap: wrap; gap: 4px; }
  .docs-nav a {
    padding: 8px 12px;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text-2);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
  }
  .docs-nav a:hover { background: var(--surface); color: var(--text); }
  .docs-nav a[aria-current="page"] { border-color: var(--border); background: var(--surface); color: var(--primary); }
  .docs-article { min-width: 0; max-width: 760px; }
  .docs-article h1 { margin: 0 0 24px; font-size: 36px; }
  .docs-article h2 { margin: 40px 0 12px; font-size: 24px; }
  .docs-article h3 { margin: 28px 0 8px; font-size: 18px; }
  .docs-article a { color: var(--primary); }
  .docs-article a:hover { color: var(--primary-hover); }
  .docs-article ul, .docs-article ol { padding-left: 24px; }
  .docs-article li { margin: 4px 0; }
  .docs-article code {
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
  }
  .docs-article pre { overflow-x: auto; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .docs-article pre code { padding: 0; border: 0; background: none; }
  .docs-article blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid var(--border); color: var(--text-2); }
  .docs-article table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .docs-article th, .docs-article td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; }
  @media (min-width: 1024px) {
    .docs { grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }

<main class="wrap">
  <div id="view"></div>
</main>

<footer>Wbudowane dane: <code>claude-code-commands.json</code>. Własne dokumenty zapisują się w przeglądarce.</footer>

<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<script type="text/typescript" id="app">
  // Document types, their JSON schemas and the editor/viewer that works with them.
  type DocType = "cheatsheet" | "presentation" | "quiz";

  interface JsonSchema {
    type: "object" | "array" | "string";
    title?: string;
    required?: string[];
    properties?: Record<string, JsonSchema>;
    items?: JsonSchema;
    minLength?: number;
    default?: string;
    enum?: string[];
    "x-labels"?: string[];
    "x-format"?: "color";
    "x-multiline"?: boolean;
    // The field is shown (and kept) only when the sibling `type` field has one of these values.
    "x-showFor"?: string[];
  }

  interface StoredDoc {
    id: string;
    type: DocType;
    updatedAt: string;
    data: any;
  }

  interface Doc extends StoredDoc {
    builtin: boolean;
    example?: boolean;
  }

  interface HelpPage {
    slug: string;
    title: string;
    order: number;
    body: string;
  }

  interface CommandItem {
    command: string;
    description: string;
    example?: string;
    tags?: string[];
  }

  interface FormContext {
    changed: () => void;
    rebuild: () => void;
  }

  interface State {
    schemas: Record<DocType, JsonSchema>;
    builtin: any;
    examples: Doc[];
    stored: StoredDoc[];
    view: "library" | "cheatsheet" | "presentation" | "quiz" | "editor";
    doc: Doc | null;
    query: string;
    section: string;
    slide: number;
    presenter: boolean;
    question: number;
    answers: Record<number, string>;
  }

  const STORAGE_KEY = "cheatsheet.documents";
  const BUILTIN_ID = "claude-code-commands";
  const BUILTIN_URL = "claude-code-commands.json";
  const EXAMPLES_DIR = "examples/";
  const HELP_DIR = "docs/";
  const SCHEMA_URLS: Record<DocType, string> = {
    cheatsheet: "schemas/cheatsheet.schema.json",
    presentation: "schemas/presentation.schema.json",
    quiz: "schemas/quiz.schema.json",
  };
  const DOC_TYPE_LABELS: Record<DocType, string> = {
    cheatsheet: "Ściąga",
    presentation: "Prezentacja",
    quiz: "Quiz",
  };

  const state: State = {
    schemas: {} as Record<DocType, JsonSchema>,
    builtin: null,
    examples: [],
    stored: [],
    view: "library",
    doc: null,
    query: "",
    section: "all",
    slide: 0,
    presenter: false,
    question: 0,
    answers: {},
  };

  const els = {
    searchWrap: document.getElementById("search-wrap") as HTMLElement,
    search: document.getElementById("search") as HTMLInputElement,
    theme: document.getElementById("theme") as HTMLElement,
    view: document.getElementById("view") as HTMLElement,
  };

  function el(tag: string, props: Record<string, string> = {}, children: Node[] = []): HTMLElement {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "className") node.className = value;
      else if (key === "text") node.textContent = value;
      else node.setAttribute(key, value);
    }
    for (const child of children) node.append(child);
    return node;
  }

  function button(text: string, className: string, onClick: () => void): HTMLButtonElement {
    const btn = el("button", { className, type: "button", text }) as HTMLButtonElement;
    btn.addEventListener("click", onClick);
    return btn;
  }

  function link(text: string, className: string, href: string): HTMLElement {
    return el("a", { className, href, text });
  }

  function statusElement(message: string, isError = false): HTMLElement {
    return el("p", { className: `status${isError ? " error" : ""}`, text: message });
  }

  function isDocType(value: string): value is DocType {
    return value === "cheatsheet" || value === "presentation" || value === "quiz";
  }

  function newId(): string {
    return `doc-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
  }

  // Storage: built-in document is read from the JSON file, user documents live in localStorage.
  function readStoredDocs(): StoredDoc[] {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? (JSON.parse(raw) as StoredDoc[]) : [];
    } catch (err) {
      console.error("Failed to read documents:", err);
      return [];
    }
  }

  function writeStoredDocs(docs: StoredDoc[]): boolean {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(docs));
      return true;
    } catch (err) {
      console.error("Failed to save documents:", err);
      return false;
    }
  }

  function allDocs(): Doc[] {
    const builtin: Doc[] = state.builtin
      ? [{ id: BUILTIN_ID, type: "cheatsheet", updatedAt: "", data: state.builtin, builtin: true }]
      : [];
    return [...builtin, ...state.examples, ...state.stored.map((doc) => ({ ...doc, builtin: false }))];
  }

  function findDoc(id: string): Doc | undefined {
    return allDocs().find((doc) => doc.id === id);
  }

  function upsertStoredDoc(doc: StoredDoc): boolean {
    const next = [doc, ...state.stored.filter((item) => item.id !== doc.id)];
    if (!writeStoredDocs(next)) return false;
    state.stored = next;
    return true;
  }

  function removeStoredDoc(id: string): void {
    state.stored = state.stored.filter((doc) => doc.id !== id);
    writeStoredDocs(state.stored);
  }

  // Schema helpers: default values, cleaning of the editor draft, and validation.
  function isPlainObject(value: unknown): value is Record<string, any> {
    return typeof value === "object" && value !== null && !Array.isArray(value);
  }

  function createDefault(schema: JsonSchema): any {
    if (schema.type === "string") return schema.default ?? "";
    if (schema.type === "array") return [];
    const result: Record<string, unknown> = {};
    for (const [key, prop] of Object.entries(schema.properties ?? {})) {
      result[key] = createDefault(prop);
    }
    return result;
  }

  function isEmptyValue(value: unknown): boolean {
    return (
      value === undefined ||
      value === "" ||
      (Array.isArray(value) && value.length === 0) ||
      (isPlainObject(value) && Object.keys(value).length === 0)
    );
  }

  // True when a conditional field (x-showFor) applies to the object it belongs to.
  function isFieldShown(prop: JsonSchema, owner: any): boolean {
    return !prop["x-showFor"] || prop["x-showFor"].includes(owner?.type);
  }

  // Turns the editor draft into the JSON that is saved: trims text and drops empty optional fields.
  function cleanValue(schema: JsonSchema, value: any): any {
    if (schema.type === "string") return typeof value === "string" ? value.trim() : value;
    if (schema.type === "array") {
      if (!Array.isArray(value) || !schema.items) return value;
      if (schema.items.type === "string") {
        return value.map((item) => String(item).trim()).filter((item) => item !== "");
      }
      return value.map((item) => cleanValue(schema.items!, item));
    }
    const required = schema.required ?? [];
    const result: Record<string, unknown> = {};
    for (const [key, prop] of Object.entries(schema.properties ?? {})) {
      if (!isFieldShown(prop, value)) continue;
      const cleaned = cleanValue(prop, value?.[key]);
      if (isEmptyValue(cleaned) && !required.includes(key)) continue;
      result[key] = cleaned;
    }
    return result;
  }

  function childPath(path: string, key: string): string {
    return path ? `${path}.${key}` : key;
  }

  function validate(schema: JsonSchema, value: unknown, path: string, errors: string[]): void {
    const where = path || "dokument";
    if (schema.type === "string") {
      if (typeof value !== "string") {
        errors.push(`${where}: oczekiwano tekstu`);
      } else if (schema.minLength && value.length < schema.minLength) {
        errors.push(`${where}: pole wymagane`);
      } else if (schema.enum && !schema.enum.includes(value)) {
        errors.push(`${where}: niedozwolona wartość „${value}”`);
      }
      return;
    }
    if (schema.type === "array") {
      if (!Array.isArray(value)) {
        errors.push(`${where}: oczekiwano listy`);
        return;
      }
      if (schema.items) {
        value.forEach((item, index) => validate(schema.items!, item, `${path}[${index}]`, errors));
      }
      return;
    }
    if (!isPlainObject(value)) {
      errors.push(`${where}: oczekiwano obiektu`);
      return;
    }
    for (const key of schema.required ?? []) {
      if (value[key] === undefined) errors.push(`${childPath(path, key)}: pole wymagane`);
    }
    for (const [key, prop] of Object.entries(schema.properties ?? {})) {
      if (value[key] !== undefined) validate(prop, value[key], childPath(path, key), errors);
    }
  }

  function validationErrors(schema: JsonSchema, value: unknown): string[] {
    const errors: string[] = [];
    validate(schema, value, "", errors);
    return errors;
  }

  // Form builder: generates inputs straight from the schema.
  function wrapField(label: HTMLElement, control: HTMLElement): HTMLElement {
    return el("label", { className: "field" }, [label, control]);
  }

  function buildFields(schema: JsonSchema, target: Record<string, any>, ctx: FormContext): HTMLElement[] {
    const required = schema.required ?? [];
    // Defaults come first: x-showFor depends on sibling values such as `type`, which may be missing in old documents.
    for (const [key, prop] of Object.entries(schema.properties ?? {})) {
      if (target[key] === undefined) target[key] = createDefault(prop);
    }
    return Object.entries(schema.properties ?? {}).filter(([, prop]) => isFieldShown(prop, target)).map(([key, prop]) => {
      return buildField(prop, prop.title ?? key, target[key], required.includes(key), (next) => {
        target[key] = next;
      }, ctx);
    });
  }

  function buildField(
    schema: JsonSchema,
    label: string,
    value: any,
    required: boolean,
    onChange: (next: any) => void,
    ctx: FormContext
  ): HTMLElement {
    const labelEl = el("span", { className: "field-label", text: required ? `${label} *` : label });

    if (schema.type === "string" && schema.enum) {
      const select = document.createElement("select");
      schema.enum.forEach((option, index) => {
        const optionEl = el("option", { value: option, text: schema["x-labels"]?.[index] ?? option });
        select.append(optionEl);
      });
      select.value = typeof value === "string" ? value : "";
      select.addEventListener("change", () => {
        onChange(select.value);
        // Other fields may depend on this value (x-showFor), so the form is rebuilt.
        ctx.rebuild();
      });
      return wrapField(labelEl, select);
    }

    if (schema.type === "string" && schema["x-format"] === "color") {
      const control = document.createElement("input");
      control.type = "color";
      control.value = /^#[0-9a-f]{6}$/i.test(value) ? value : schema.default ?? "#000000";
      control.addEventListener("input", () => {
        onChange(control.value);
        ctx.changed();
      });
      return wrapField(labelEl, control);
    }

    if (schema.type === "string") {
      const control = schema["x-multiline"]
        ? document.createElement("textarea")
        : document.createElement("input");
      control.value = typeof value === "string" ? value : "";
      control.addEventListener("input", () => {
        onChange(control.value);
        ctx.changed();
      });
      return wrapField(labelEl, control);
    }

    if (schema.type === "array" && schema.items?.type === "string") {
      // One list item per line.
      const control = document.createElement("textarea");
      control.value = (Array.isArray(value) ? value : []).join("\n");
      control.addEventListener("input", () => {
        onChange(control.value.split("\n"));
        ctx.changed();
      });
      return wrapField(labelEl, control);
    }

    if (schema.type === "array" && schema.items) {
      const itemSchema = schema.items;
      const items: any[] = Array.isArray(value) ? value : [];
      onChange(items);
      const group = el("div", { className: "group" }, [
        el("span", { className: "field-label", text: `${label} (${items.length})` }),
      ]);
      items.forEach((item, index) => {
        const removeBtn = button("Usuń", "btn btn-danger btn-sm", () => {
          items.splice(index, 1);
          ctx.rebuild();
        });
        const moveBtn = (text: string, title: string, offset: number): HTMLButtonElement => {
          const btn = button(text, "btn btn-ghost btn-sm", () => {
            const [moved] = items.splice(index, 1);
            items.splice(index + offset, 0, moved);
            ctx.rebuild();
          });
          btn.title = title;
          btn.disabled = index + offset < 0 || index + offset >= items.length;
          return btn;
        };
        const duplicateBtn = button("Duplikuj", "btn btn-ghost btn-sm", () => {
          items.splice(index + 1, 0, JSON.parse(JSON.stringify(item)));
          ctx.rebuild();
        });
        group.append(
          el("div", { className: "item" }, [
            el("div", { className: "item-head" }, [
              el("span", { className: "field-label", text: `#${index + 1}` }),
              el("div", { className: "item-actions" }, [
                moveBtn("↑", "Przesuń wyżej", -1),
                moveBtn("↓", "Przesuń niżej", 1),
                duplicateBtn,
                removeBtn,
              ]),
            ]),
            ...buildFields(itemSchema, item, ctx),
          ])
        );
      });
      group.append(
        button("+ Dodaj", "btn btn-secondary btn-sm", () => {
          items.push(createDefault(itemSchema));
          ctx.rebuild();
        })
      );
      return group;
    }

    // Object: its fields are placed in a group.
    const target = isPlainObject(value) ? value : {};
    onChange(target);
    return el("div", { className: "group" }, [labelEl, ...buildFields(schema, target, ctx)]);
  }

  function downloadJson(data: unknown, title: string): void {
    const slug = title.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "") || "dokument";
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
    const anchor = el("a", { href: url, download: `${slug}.json` });
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Cheat sheet viewer.
  function matches(item: CommandItem, sectionTitle: string, query: string): boolean {
    if (!query) return true;
    const haystack = [
      item.command,
      item.description,
      item.example || "",
      sectionTitle,
      ...(item.tags || []),
    ]
      .join(" ")
      .toLowerCase();
    return haystack.includes(query);
  }

  function makeCard(item: CommandItem): HTMLElement {
    const copyBtn = el("button", { className: "copy", type: "button", text: "Kopiuj" });
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(item.command);
        copyBtn.textContent = "Skopiowano";
      } catch {
        copyBtn.textContent = "Błąd";
      }
      setTimeout(() => (copyBtn.textContent = "Kopiuj"), 1200);
    });

    const children: Node[] = [
      el("div", { className: "card-head" }, [
        el("code", { className: "cmd", text: item.command }),
        copyBtn,
      ]),
      el("p", { className: "desc", text: item.description }),
    ];
    if (item.example) {
      children.push(el("pre", { className: "example", text: `np. ${item.example}` }));
    }
    if (item.tags && item.tags.length) {
      children.push(
        el("div", { className: "tags" },
          item.tags.map((t) => el("span", { className: "tag", text: t })))
      );
    }
    return el("article", { className: "card" }, children);
  }

  function renderFilters(data: any): void {
    const filters = document.getElementById("filters");
    if (!filters) return;
    const makeChip = (id: string, label: string): HTMLElement => {
      const chip = button(label, "chip", () => {
        state.section = id;
        renderFilters(data);
        renderSections(data);
      });
      chip.setAttribute("aria-pressed", String(state.section === id));
      return chip;
    };
    filters.replaceChildren(
      makeChip("all", "Wszystko"),
      ...data.sections.map((s: any, index: number) => makeChip(String(index), s.title))
    );
  }

  function renderSections(data: any): void {
    const content = document.getElementById("content");
    if (!content) return;
    const q = state.query.trim().toLowerCase();
    const blocks: HTMLElement[] = [];

    data.sections.forEach((section: any, index: number) => {
      if (state.section !== "all" && state.section !== String(index)) return;
      const items = section.items.filter((item: CommandItem) => matches(item, section.title, q));
      if (!items.length) return;
      blocks.push(
        el("section", {}, [
          el("h2", { text: section.title }),
          el("p", { className: "section-desc", text: section.description || "" }),
          el("div", { className: "grid" }, items.map(makeCard)),
        ])
      );
    });

    if (!blocks.length) {
      content.replaceChildren(statusElement("Brak wyników dla podanego zapytania."));
      return;
    }
    content.replaceChildren(...blocks);
  }

  function viewerToolbar(doc: Doc): HTMLElement {
    const items: HTMLElement[] = [link("← Dokumenty", "btn btn-ghost btn-sm", "#/")];
    if (!doc.builtin) items.push(link("Edytuj", "btn btn-secondary btn-sm", `#/edit/${doc.id}`));
    items.push(button("Pobierz JSON", "btn btn-ghost btn-sm", () => downloadJson(doc.data, doc.data.title)));
    return el("div", { className: "toolbar" }, items);
  }

  function renderCheatsheet(doc: Doc): void {
    state.view = "cheatsheet";
    state.query = "";
    state.section = "all";
    els.search.value = "";
    els.searchWrap.hidden = false;
    document.title = doc.data.title;

    els.view.replaceChildren(
      viewerToolbar(doc),
      el("div", { className: "intro" }, [
        el("h1", { text: doc.data.title }),
        el("p", { className: "subtitle", text: doc.data.description || "" }),
        el("div", { id: "filters", className: "filters", role: "group", "aria-label": "Filtr sekcji" }),
      ]),
      el("div", { id: "content" })
    );
    renderFilters(doc.data);
    renderSections(doc.data);
  }

  // Slide rendering, shared by the viewer, thumbnails, next-slide preview and the editor preview.
  interface SlideTheme {
    accent?: string;
    background?: string;
    text?: string;
    font?: string;
  }

  const DEFAULT_THEME = { accent: "#6366F1", background: "#FFFFFF", text: "#0A0A0A", font: "sans" };
  const SLIDE_FONTS: Record<string, string> = {
    sans: '"DM Sans", system-ui, sans-serif',
    serif: 'Georgia, "Times New Roman", serif',
    mono: '"JetBrains Mono", ui-monospace, monospace',
    display: '"General Sans", system-ui, sans-serif',
  };
  const SLIDE_TYPES = ["title", "text", "bullets", "two-columns", "quote", "code"];

  function themeColor(value: unknown, fallback: string): string {
    return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value) ? value : fallback;
  }

  function renderSlideContent(slide: any, theme: SlideTheme = {}): HTMLElement {
    // A slide without a (known) type is shown as a bullet list, like in the old format.
    const type = SLIDE_TYPES.includes(slide.type) ? slide.type : "bullets";
    const heading = el("h2", { text: slide.title ?? "" });
    const body = el("div", { className: "slide-body" });

    if (type === "title") {
      body.append(heading);
      if (slide.subtitle) body.append(el("p", { text: slide.subtitle }));
    } else if (type === "text") {
      body.append(heading, el("p", { text: slide.text ?? "" }));
    } else if (type === "two-columns") {
      body.append(
        heading,
        el("div", { className: "slide-columns" }, [
          el("div", { className: "slide-column", text: slide.left ?? "" }),
          el("div", { className: "slide-column", text: slide.right ?? "" }),
        ])
      );
    } else if (type === "quote") {
      body.append(
        el("span", { className: "slide-kicker", text: slide.title ?? "" }),
        el("blockquote", { text: slide.quote ?? "" })
      );
      if (slide.author) body.append(el("span", { className: "slide-author", text: `— ${slide.author}` }));
    } else if (type === "code") {
      body.append(heading, el("pre", { className: "slide-code-block" }, [el("code", { text: slide.code ?? "" })]));
    } else {
      body.append(heading);
      if (slide.bullets?.length) {
        body.append(el("ul", {}, slide.bullets.map((bullet: string) => el("li", { text: bullet }))));
      }
      if (slide.code) body.append(el("pre", { className: "slide-code-block" }, [el("code", { text: slide.code })]));
    }

    const node = el("div", { className: `slide slide-${type}` }, [body]);
    node.style.setProperty("--slide-accent", themeColor(theme.accent, DEFAULT_THEME.accent));
    node.style.setProperty("--slide-bg", themeColor(theme.background, DEFAULT_THEME.background));
    node.style.setProperty("--slide-text", themeColor(theme.text, DEFAULT_THEME.text));
    node.style.setProperty("--slide-font", SLIDE_FONTS[theme.font ?? ""] ?? SLIDE_FONTS.sans);
    return node;
  }

  // WCAG contrast ratio between two #rrggbb colors (1 to 21).
  function contrastRatio(first: string, second: string): number {
    const luminance = (hex: string): number => {
      const [r, g, b] = [1, 3, 5].map((index) => {
        const channel = parseInt(hex.slice(index, index + 2), 16) / 255;
        return channel <= 0.03928 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
      });
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    };
    const [light, dark] = [luminance(first), luminance(second)].sort((x, y) => y - x);
    return (light + 0.05) / (dark + 0.05);
  }

  function hasLowContrast(theme: SlideTheme): boolean {
    const background = themeColor(theme.background, DEFAULT_THEME.background);
    const text = themeColor(theme.text, DEFAULT_THEME.text);
    return contrastRatio(background, text) < 4.5;
  }

  // Presentation viewer.
  interface DeckApi {
    go: (index: number) => void;
    toggleFullscreen: () => void;
    togglePresenter: () => void;
  }

  let deckApi: DeckApi | null = null;
  let timerHandle: number | undefined;

  function stepSlide(delta: number): void {
    deckApi?.go(state.slide + delta);
  }

  function formatElapsed(milliseconds: number): string {
    const total = Math.floor(milliseconds / 1000);
    const pad = (value: number): string => String(value).padStart(2, "0");
    return `${pad(Math.floor(total / 60))}:${pad(total % 60)}`;
  }

  // Prints every slide (one per page) through the browser print dialog, where the user picks "Save as PDF".
  function exportPdf(doc: Doc): void {
    const printDeck = el("div", { id: "print-deck" }, doc.data.slides.map((slide: any) => renderSlideContent(slide, doc.data.theme ?? {})));
    const previousTitle = document.title;
    const cleanUp = (): void => {
      printDeck.remove();
      document.title = previousTitle;
      window.removeEventListener("afterprint", cleanUp);
    };
    document.body.append(printDeck);
    document.title = doc.data.title;
    window.addEventListener("afterprint", cleanUp);
    window.print();
  }

  function buildDeck(doc: Doc): HTMLElement {
    const slides: any[] = doc.data.slides;
    const theme: SlideTheme = doc.data.theme ?? {};

    const frame = el("div", { className: "deck-frame" });
    const progressBar = el("span");
    const progress = el("div", { className: "deck-progress", role: "progressbar", "aria-label": "Postęp prezentacji" }, [progressBar]);
    const counter = el("span", { className: "slide-counter" });
    const nextHost = el("div", { className: "deck-next" });
    const notes = el("p", { className: "slide-notes" });
    const timer = el("div", { className: "deck-timer", id: "deck-timer", text: "00:00" });
    const thumbsHost = el("div", { className: "deck-thumbs", "aria-label": "Lista slajdów" });
    const presenterBtn = button("Tryb prezentera", "btn btn-ghost btn-sm", () => api.togglePresenter());
    const deck = el("div", { className: "deck" });

    const thumbs = slides.map((slide, index) => {
      const thumb = el("button", { className: "deck-thumb", type: "button", "aria-label": `Slajd ${index + 1}: ${slide.title}` }, [
        renderSlideContent(slide, theme),
        el("span", { className: "deck-thumb-num", text: String(index + 1) }),
      ]);
      thumb.addEventListener("click", () => api.go(index));
      return thumb;
    });
    thumbsHost.append(...thumbs);

    const update = (): void => {
      state.slide = Math.min(Math.max(state.slide, 0), slides.length - 1);
      const slide = slides[state.slide];
      const next = slides[state.slide + 1];
      frame.replaceChildren(renderSlideContent(slide, theme));
      nextHost.replaceChildren(
        el("p", { className: "side-label", text: "Następny slajd" }),
        next ? renderSlideContent(next, theme) : el("div", { className: "deck-end", text: "Koniec prezentacji" })
      );
      notes.textContent = slide.notes ? `Notatki: ${slide.notes}` : "Brak notatek do tego slajdu.";
      counter.textContent = `${state.slide + 1} / ${slides.length}`;
      progressBar.style.background = themeColor(theme.accent, DEFAULT_THEME.accent);
      progressBar.style.width = `${((state.slide + 1) / slides.length) * 100}%`;
      progress.setAttribute("aria-valuenow", String(state.slide + 1));
      progress.setAttribute("aria-valuemax", String(slides.length));
      thumbs.forEach((thumb, index) => thumb.setAttribute("aria-current", String(index === state.slide)));
      // Keep the current thumbnail visible without scrolling the whole page.
      const current = thumbs[state.slide];
      thumbsHost.scrollTop = Math.min(Math.max(thumbsHost.scrollTop, current.offsetTop - thumbsHost.clientHeight + current.offsetHeight + 4), current.offsetTop - 4);
      thumbsHost.scrollLeft = Math.min(Math.max(thumbsHost.scrollLeft, current.offsetLeft - thumbsHost.clientWidth + current.offsetWidth + 4), current.offsetLeft - 4);
    };

    const api: DeckApi = {
      go: (index) => {
        state.slide = index;
        update();
      },
      toggleFullscreen: () => {
        if (document.fullscreenElement) void document.exitFullscreen();
        else void frame.requestFullscreen?.();
      },
      togglePresenter: () => {
        state.presenter = !state.presenter;
        deck.classList.toggle("presenter", state.presenter);
        presenterBtn.textContent = state.presenter ? "Zamknij tryb prezentera" : "Tryb prezentera";
        window.clearInterval(timerHandle);
        if (state.presenter) {
          const startedAt = Date.now();
          timer.textContent = "00:00";
          timerHandle = window.setInterval(() => {
            timer.textContent = formatElapsed(Date.now() - startedAt);
          }, 1000);
        }
      },
    };
    deckApi = api;

    deck.append(
      thumbsHost,
      el("div", { className: "deck-main" }, [
        frame,
        progress,
        el("div", { className: "slide-controls" }, [
          button("← Poprzedni", "btn btn-secondary btn-sm", () => stepSlide(-1)),
          counter,
          button("Następny →", "btn btn-secondary btn-sm", () => stepSlide(1)),
          presenterBtn,
          button("Pełny ekran", "btn btn-ghost btn-sm", () => api.toggleFullscreen()),
          button("Eksportuj do PDF", "btn btn-ghost btn-sm", () => exportPdf(doc)),
        ]),
      ]),
      el("aside", { className: "deck-side" }, [timer, nextHost, notes])
    );
    update();
    return deck;
  }

  function renderPresentation(doc: Doc): void {
    state.view = "presentation";
    state.slide = 0;
    state.presenter = false;
    window.clearInterval(timerHandle);
    deckApi = null;
    els.searchWrap.hidden = true;
    document.title = doc.data.title;

    els.view.replaceChildren(
      viewerToolbar(doc),
      el("div", { className: "intro" }, [
        el("h1", { text: doc.data.title }),
        el("p", { className: "subtitle", text: doc.data.description || "" }),
      ]),
      doc.data.slides.length ? buildDeck(doc) : statusElement("Ta prezentacja nie ma jeszcze slajdów.")
    );
  }

  // Quiz viewer: one question at a time, the answer is checked on click, the score is shown at the end.
  function renderQuestion(): void {
    const host = document.getElementById("quiz");
    if (!host || !state.doc) return;
    const questions: any[] = state.doc.data.questions;
    if (!questions.length) {
      host.replaceChildren(statusElement("Ten quiz nie ma jeszcze pytań."));
      return;
    }
    if (state.question >= questions.length) {
      renderQuizResult(host, questions);
      return;
    }

    const item = questions[state.question];
    const picked = state.answers[state.question];
    const answered = picked !== undefined;
    const options = (item.options ?? []).map((option: string) => {
      const btn = button(option, "quiz-option", () => {
        state.answers[state.question] = option;
        renderQuestion();
      });
      btn.disabled = answered;
      if (answered && option === item.answer) btn.classList.add("correct");
      if (answered && option === picked && option !== item.answer) btn.classList.add("wrong");
      return btn;
    });

    const card = el("div", { className: "quiz-card" }, [
      el("span", { className: "quiz-kicker", text: `Pytanie ${state.question + 1} z ${questions.length}` }),
      el("h2", { text: item.question }),
      el("div", { className: "quiz-options" }, options),
    ]);
    if (answered) {
      card.append(el("p", { className: "quiz-feedback", text: picked === item.answer ? "Dobrze!" : "To nie ta odpowiedź." }));
      if (item.explanation) card.append(el("p", { className: "quiz-explanation", text: item.explanation }));
    }

    const prev = button("← Poprzednie", "btn btn-secondary btn-sm", () => stepQuestion(-1));
    prev.disabled = state.question === 0;
    host.replaceChildren(
      card,
      el("div", { className: "slide-controls" }, [
        prev,
        el("span", { className: "slide-counter", text: `${state.question + 1} / ${questions.length}` }),
        button(state.question === questions.length - 1 ? "Zobacz wynik" : "Następne →", "btn btn-secondary btn-sm", () => stepQuestion(1)),
      ])
    );
  }

  function renderQuizResult(host: HTMLElement, questions: any[]): void {
    const score = questions.filter((item, index) => state.answers[index] === item.answer).length;
    host.replaceChildren(
      el("div", { className: "quiz-card" }, [
        el("span", { className: "quiz-kicker", text: "Wynik" }),
        el("h2", { text: `${score} / ${questions.length}` }),
        el("p", { className: "subtitle", text: `Poprawnych odpowiedzi: ${score} z ${questions.length}.` }),
      ]),
      el("div", { className: "slide-controls" }, [
        button("← Ostatnie pytanie", "btn btn-secondary btn-sm", () => stepQuestion(-1)),
        button("Zacznij od nowa", "btn btn-primary btn-sm", () => {
          state.question = 0;
          state.answers = {};
          renderQuestion();
        }),
      ])
    );
  }

  function stepQuestion(delta: number): void {
    state.question = Math.max(state.question + delta, 0);
    renderQuestion();
  }

  function renderQuiz(doc: Doc): void {
    state.view = "quiz";
    state.question = 0;
    state.answers = {};
    els.searchWrap.hidden = true;
    document.title = doc.data.title;

    els.view.replaceChildren(
      viewerToolbar(doc),
      el("div", { className: "intro" }, [
        el("h1", { text: doc.data.title }),
        el("p", { className: "subtitle", text: doc.data.description || "" }),
      ]),
      el("div", { id: "quiz" })
    );
    renderQuestion();
  }

  // Library: list of documents and buttons for creating new ones.
  function duplicateDoc(doc: Doc): void {
    const copy: StoredDoc = {
      id: newId(),
      type: doc.type,
      updatedAt: new Date().toISOString(),
      data: JSON.parse(JSON.stringify(doc.data)),
    };
    copy.data.title = `${doc.data.title} (kopia)`;
    if (upsertStoredDoc(copy)) {
      location.hash = `#/edit/${copy.id}`;
    } else {
      alert("Nie udało się zapisać kopii w przeglądarce.");
    }
  }

  function deleteDoc(doc: Doc): void {
    if (!confirm(`Usunąć dokument „${doc.data.title}”?`)) return;
    removeStoredDoc(doc.id);
    route();
  }

  function makeDocCard(doc: Doc): HTMLElement {
    const counter = doc.type === "cheatsheet"
      ? `${doc.data.sections?.length ?? 0} sekcji`
      : doc.type === "quiz"
        ? `${doc.data.questions?.length ?? 0} pytań`
        : `${doc.data.slides?.length ?? 0} slajdów`;

    const actions: HTMLElement[] = [];
    if (!doc.builtin) actions.push(link("Edytuj", "btn btn-secondary btn-sm", `#/edit/${doc.id}`));
    actions.push(button("Duplikuj", "btn btn-secondary btn-sm", () => duplicateDoc(doc)));
    actions.push(button("Pobierz JSON", "btn btn-ghost btn-sm", () => downloadJson(doc.data, doc.data.title)));
    if (!doc.builtin) actions.push(button("Usuń", "btn btn-danger btn-sm", () => deleteDoc(doc)));

    return el("article", { className: "card" }, [
      el("div", { className: "card-head" }, [
        el("span", { className: "tag", text: DOC_TYPE_LABELS[doc.type] }),
        el("span", { className: "tag", text: doc.builtin ? (doc.example ? "przykład" : "wbudowana") : counter }),
      ]),
      el("h2", { className: "card-title" }, [
        link(doc.data.title, "", `#/doc/${doc.id}`),
      ]),
      el("p", { className: "desc", text: doc.data.description || "" }),
      el("div", { className: "card-actions" }, actions),
    ]);
  }

  function renderLibrary(): void {
    state.view = "library";
    state.doc = null;
    els.searchWrap.hidden = true;
    document.title = "Dokumenty – Claude Code";

    const docs = allDocs();
    els.view.replaceChildren(
      el("div", { className: "intro" }, [
        el("h1", { text: "Dokumenty" }),
        el("p", { className: "subtitle", text: "Twórz ściągi, prezentacje i quizy. Własne dokumenty zapisują się w przeglądarce." }),
      ]),
      el("div", { className: "toolbar" }, [
        link("+ Nowa ściąga", "btn btn-secondary", "#/new/cheatsheet"),
        link("+ Nowa prezentacja", "btn btn-secondary", "#/new/presentation"),
        link("+ Nowy quiz", "btn btn-secondary", "#/new/quiz"),
      ]),
      el("div", { className: "grid", style: "margin-top: 32px" }, docs.map(makeDocCard))
    );
  }

  // Editor: form generated from the schema, live JSON preview and validation.
  function renderEditor(existing: StoredDoc | null, type: DocType): void {
    state.view = "editor";
    state.doc = null;
    els.searchWrap.hidden = true;
    document.title = existing ? "Edycja dokumentu – Claude Code" : "Nowy dokument – Claude Code";

    const schema = state.schemas[type];
    const draft: Record<string, any> = existing
      ? JSON.parse(JSON.stringify(existing.data))
      : createDefault(schema);

    const form = el("div", { className: "form" });
    const errorList = el("ul", { className: "errors" });
    const preview = el("pre", { className: type === "presentation" ? "json json-short" : "json" });
    const saveMessage = el("span", { className: "status-line", role: "status" });

    // Live slide preview (presentations only): shows the slide the user is editing.
    const slidePreview = type === "presentation" ? el("div", { className: "slide-preview" }) : null;
    let previewIndex = 0;
    const renderSlidePreview = (): void => {
      if (!slidePreview) return;
      const slides: any[] = Array.isArray(draft.slides) ? draft.slides : [];
      if (!slides.length) {
        slidePreview.replaceChildren(statusElement("Dodaj slajd, aby zobaczyć podgląd."));
        return;
      }
      previewIndex = Math.min(Math.max(previewIndex, 0), slides.length - 1);
      const theme: SlideTheme = draft.theme ?? {};
      const move = (delta: number): void => {
        previewIndex += delta;
        renderSlidePreview();
      };
      const prev = button("←", "btn btn-ghost btn-sm", () => move(-1));
      const next = button("→", "btn btn-ghost btn-sm", () => move(1));
      prev.disabled = previewIndex === 0;
      next.disabled = previewIndex === slides.length - 1;
      slidePreview.replaceChildren(
        renderSlideContent(slides[previewIndex], theme),
        el("div", { className: "slide-controls" }, [
          prev,
          el("span", { className: "slide-counter", text: `Slajd ${previewIndex + 1} / ${slides.length}` }),
          next,
        ]),
        ...(hasLowContrast(theme)
          ? [el("p", { className: "contrast-warning", text: "Uwaga: kolor tekstu jest zbyt podobny do koloru tła, slajdy mogą być nieczytelne." })]
          : [])
      );
    };
    form.addEventListener("focusin", (event) => {
      const item = (event.target as HTMLElement).closest(".item");
      const index = item ? Array.from(form.querySelectorAll(".item")).indexOf(item) : -1;
      if (index >= 0 && index !== previewIndex) {
        previewIndex = index;
        renderSlidePreview();
      }
    });

    const refresh = (): void => {
      renderSlidePreview();
      const cleaned = cleanValue(schema, draft);
      const errors = validationErrors(schema, cleaned);
      preview.textContent = JSON.stringify(cleaned, null, 2);
      errorList.replaceChildren(...errors.map((message) => el("li", { text: message })));
      errorList.hidden = errors.length === 0;
    };

    const ctx: FormContext = {
      changed: refresh,
      rebuild: () => {
        form.replaceChildren(...buildFields(schema, draft, ctx));
        refresh();
      },
    };

    const saveBtn = button("Zapisz", "btn btn-primary", () => {
      const cleaned = cleanValue(schema, draft);
      if (validationErrors(schema, cleaned).length) {
        refresh();
        saveMessage.textContent = "Popraw błędy przed zapisem.";
        return;
      }
      const id = existing ? existing.id : newId();
      const saved = upsertStoredDoc({ id, type, updatedAt: new Date().toISOString(), data: cleaned });
      if (!saved) {
        saveMessage.textContent = "Nie udało się zapisać w przeglądarce.";
        return;
      }
      location.hash = `#/doc/${id}`;
    });

    const cancelHref = existing ? `#/doc/${existing.id}` : "#/";

    els.view.replaceChildren(
      link("← Anuluj", "back", cancelHref),
      el("div", { className: "intro", style: "padding-top: 0" }, [
        el("h1", { text: existing ? "Edycja dokumentu" : `Nowy dokument: ${DOC_TYPE_LABELS[type]}` }),
        el("p", { className: "subtitle", text: "Wypełnij pola. JSON powstaje na bieżąco i jest sprawdzany względem schematu." }),
      ]),
      el("div", { className: "toolbar" }, [
        saveBtn,
        button("Pobierz JSON", "btn btn-secondary", () => downloadJson(cleanValue(schema, draft), draft.title || "dokument")),
        saveMessage,
      ]),
      el("div", { className: "editor" }, [
        form,
        el("aside", { className: "preview" }, [
          ...(slidePreview ? [el("h2", { text: "Podgląd slajdu" }), slidePreview] : []),
          el("h2", { text: "JSON" }),
          errorList,
          preview,
        ]),
      ])
    );
    ctx.rebuild();
  }

  function renderNotFound(): void {
    state.view = "library";
    els.searchWrap.hidden = true;
    els.view.replaceChildren(
      statusElement("Nie znaleziono dokumentu.", true),
      el("p", { className: "status" }, [link("← Wróć do listy dokumentów", "", "#/")])
    );
  }

  // Routing by hash: #/, #/doc/<id>, #/edit/<id>, #/new/<type>.
  function route(): void {
    const [view = "", id = ""] = location.hash
      .replace(/^#\/?/, "")
      .split("/")
      .map((part) => decodeURIComponent(part));

    if (view === "help") {
      void showHelp(id);
      return;
    }
    if (view === "doc") {
      const doc = findDoc(id);
      if (!doc) return renderNotFound();
      state.doc = doc;
      if (doc.type === "cheatsheet") renderCheatsheet(doc);
      else if (doc.type === "quiz") renderQuiz(doc);
      else renderPresentation(doc);
      return;
    }
    if (view === "edit") {
      const stored = state.stored.find((doc) => doc.id === id);
      if (!stored) return renderNotFound();
      renderEditor(stored, stored.type);
      return;
    }
    if (view === "new") {
      if (!isDocType(id)) return renderNotFound();
      renderEditor(null, id);
      return;
    }
    renderLibrary();
    refreshExamples();
  }

  function isTyping(target: EventTarget | null): boolean {
    return target instanceof HTMLElement && ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName);
  }

  els.search.addEventListener("input", (event) => {
    state.query = (event.target as HTMLInputElement).value;
    if (state.view === "cheatsheet" && state.doc) renderSections(state.doc.data);
  });

  document.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k" && state.view === "cheatsheet") {
      event.preventDefault();
      els.search.focus();
      els.search.select();
      return;
    }
    if (state.view === "presentation" && deckApi && !isTyping(event.target) && !event.metaKey && !event.ctrlKey && !event.altKey) {
      const onControl = event.target instanceof HTMLElement && ["BUTTON", "A"].includes(event.target.tagName);
      const key = event.key.toLowerCase();
      if (key === "arrowright" || key === "arrowdown" || key === "pagedown" || (key === " " && !onControl)) {
        event.preventDefault();
        stepSlide(1);
      } else if (key === "arrowleft" || key === "arrowup" || key === "pageup") {
        event.preventDefault();
        stepSlide(-1);
      } else if (key === "home") {
        event.preventDefault();
        deckApi.go(0);
      } else if (key === "end") {
        event.preventDefault();
        deckApi.go(Number.MAX_SAFE_INTEGER);
      } else if (key === "f") {
        deckApi.toggleFullscreen();
      } else if (key === "p") {
        deckApi.togglePresenter();
      }
    }
  });

  const root = document.documentElement;
  els.theme.addEventListener("click", () => {
    const current = root.getAttribute("data-theme");
    const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
    const isDark = current ? current === "dark" : systemDark;
    root.setAttribute("data-theme", isDark ? "light" : "dark");
  });

  async function loadJson<T>(url: string): Promise<T> {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
    return (await response.json()) as T;
  }

  // Finds files with the given extension under a directory by reading its index page (nginx autoindex or
  // `python3 -m http.server`). Subdirectories are followed, so a new file is picked up without a rebuild.
  async function listFiles(dir: string, extension: string): Promise<string[]> {
    const response = await fetch(dir, { cache: "no-store" });
    if (!response.ok) return [];
    const listing = await response.text();
    const files: string[] = [];
    for (const match of listing.matchAll(/href="([^"?#]+)"/g)) {
      const href = decodeURIComponent(match[1]);
      if (href.startsWith("/") || href.startsWith("..")) continue;
      if (href.endsWith("/")) files.push(...(await listFiles(dir + href, extension)));
      else if (href.endsWith(extension)) files.push(dir + href);
    }
    return files;
  }

  async function loadExamples(): Promise<Doc[]> {
    try {
      const docs: Doc[] = [];
      for (const file of await listFiles(EXAMPLES_DIR, ".json")) {
        try {
          const data = await loadJson<any>(file);
          const type: DocType | null = Array.isArray(data.sections)
            ? "cheatsheet"
            : Array.isArray(data.slides)
              ? "presentation"
              : Array.isArray(data.questions)
                ? "quiz"
                : null;
          const name = file.slice(EXAMPLES_DIR.length).replace(/\.json$/, "").replace(/\//g, "-");
          if (type) docs.push({ id: `example-${name}`, type, updatedAt: "", data, builtin: true, example: true });
        } catch (err) {
          console.error(`Failed to load example ${file}:`, err);
        }
      }
      return docs;
    } catch (err) {
      console.error("Failed to list examples:", err);
      return [];
    }
  }

  // Reloads examples and re-renders the library only when the list has changed.
  async function refreshExamples(): Promise<void> {
    const examples = await loadExamples();
    if (JSON.stringify(examples) === JSON.stringify(state.examples)) return;
    state.examples = examples;
    if (state.view === "library") renderLibrary();
  }

  // Splits the YAML-like front matter (title, order) from the Markdown body.
  function parseFrontMatter(text: string): { meta: Record<string, string>; body: string } {
    const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    if (!match) return { meta: {}, body: text };
    const meta: Record<string, string> = {};
    for (const line of match[1].split("\n")) {
      const colon = line.indexOf(":");
      if (colon > 0) meta[line.slice(0, colon).trim()] = line.slice(colon + 1).trim();
    }
    return { meta, body: text.slice(match[0].length) };
  }

  // Reads every article in docs/ on each visit, so an edited or new article shows up after a page reload.
  async function loadHelpPages(): Promise<HelpPage[]> {
    try {
      const pages: HelpPage[] = [];
      for (const file of await listFiles(HELP_DIR, ".md")) {
        const slug = file.slice(HELP_DIR.length).replace(/\.md$/, "");
        if (slug.includes("/")) continue;
        const response = await fetch(file, { cache: "no-store" });
        if (!response.ok) continue;
        const { meta, body } = parseFrontMatter(await response.text());
        pages.push({ slug, title: meta.title || slug, order: Number(meta.order) || 999, body });
      }
      return pages.sort((a, b) => a.order - b.order || a.title.localeCompare(b.title, "pl"));
    } catch (err) {
      console.error("Failed to load docs:", err);
      return [];
    }
  }

  // Documentation view: article list on the left, rendered Markdown on the right.
  function renderHelp(pages: HelpPage[], slug: string): void {
    state.view = "help";
    state.doc = null;
    els.searchWrap.hidden = true;
    const page = pages.find((item) => item.slug === slug) ?? pages[0];
    if (!page) {
      els.view.replaceChildren(statusElement("Dokumentacja jest pusta.", true));
      return;
    }
    document.title = `${page.title} – Instrukcja`;

    const menu = el("nav", { className: "docs-nav", "aria-label": "Spis artykułów" }, pages.map((item) => {
      const entry = link(item.title, "", `#/help/${item.slug}`);
      if (item.slug === page.slug) entry.setAttribute("aria-current", "page");
      return entry;
    }));

    const content = el("div");
    content.innerHTML = DOMPurify.sanitize(marked.parse(page.body) as string);
    for (const anchor of content.querySelectorAll<HTMLAnchorElement>('a[href$=".md"]')) {
      anchor.setAttribute("href", `#/help/${anchor.getAttribute("href")!.replace(/\.md$/, "")}`);
    }
    const article = el("article", { className: "docs-article" }, [el("h1", { text: page.title }), content]);

    els.view.replaceChildren(el("div", { className: "docs" }, [menu, article]));
    window.scrollTo(0, 0);
  }

  async function showHelp(slug: string): Promise<void> {
    const pages = await loadHelpPages();
    renderHelp(pages, slug || "index");
  }

  async function init(): Promise<void> {
    try {
      const [cheatsheetSchema, presentationSchema, quizSchema, builtin] = await Promise.all([
        loadJson<JsonSchema>(SCHEMA_URLS.cheatsheet),
        loadJson<JsonSchema>(SCHEMA_URLS.presentation),
        loadJson<JsonSchema>(SCHEMA_URLS.quiz),
        loadJson<any>(BUILTIN_URL),
      ]);
      state.schemas = { cheatsheet: cheatsheetSchema, presentation: presentationSchema, quiz: quizSchema };
      state.builtin = builtin;
    } catch (err) {
      console.error("Failed to load data:", err);
      els.view.replaceChildren(
        statusElement(
          "Nie udało się wczytać danych. Otwierając plik bezpośrednio z dysku (file://), przeglądarka blokuje " +
          "wczytywanie plików – uruchom lokalny serwer, np. `python3 -m http.server` w katalogu z plikami.",
          true
        )
      );
      return;
    }
    state.examples = await loadExamples();
    state.stored = readStoredDocs();
    window.addEventListener("hashchange", route);
    route();
  }

  init();
</script>
<script>
  const appSource = document.getElementById("app").textContent;
  const { code } = Babel.transform(appSource, { filename: "app.ts", presets: ["typescript"] });
  const appScript = document.createElement("script");
  appScript.textContent = code;
  document.body.append(appScript);
</script>
</body>
